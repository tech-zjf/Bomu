    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

const clock=n=&gt;`${Math.floor(n/60).toString().padStart(2,&#x27;0&#x27;)}:${Math.floor(n%60).toString().padStart(2,&#x27;0&#x27;)}`;
const art=f=&gt;f.art===&#x27;train&#x27;?`&lt;img class=&quot;m-art-img&quot; src=&quot;${picture}&quot; alt=&quot;山间列车示例视频画面&quot;&gt;`:`&lt;div class=&quot;m-art ${f.art}&quot; aria-label=&quot;${f.title}示意缩略图&quot;&gt;&lt;strong&gt;${f.title}&lt;/strong&gt;&lt;/div&gt;`;
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:state.view,design:&#x27;柔和极简 · Apple TV 播放控件&#x27;,favorites:films.filter(f=&gt;f.favorite).map(f=&gt;f.title)},privateContent:{view:state.view,compact:state.compact,film:state.film}}).catch(()=&gt;{});}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});root.querySelectorAll(&#x27;button&#x27;).forEach(b=&gt;b.classList.add(&#x27;cursor-interaction&#x27;));}
let toastTimer,importTimer;

function navigate(view){clearInterval(importTimer);state.view=view;state.pop=null;state.modal=null;state.immersive=false;if(view!==&#x27;player&#x27;)state.playing=false;scene.value=view;render();save();}
function openFilm(id){state.film=Number(id);state.time=films[state.film].position;state.queue=false;state.playing=false;navigate(&#x27;player&#x27;);}
function head(title,sub,actions=&#x27;&#x27;){return `&lt;div class=&quot;m-toprow&quot;&gt;&lt;div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p class=&quot;m-page-sub&quot;&gt;${sub}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;m-actions&quot;&gt;${actions}&lt;/div&gt;&lt;/div&gt;`;}
function card(f,continued=false){return `&lt;article class=&quot;m-media-card&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;film:${f.id}&quot; class=&quot;m-art-button cursor-interaction&quot; aria-label=&quot;${continued?&#x27;继续观看&#x27;:&#x27;播放&#x27;}${f.title}&quot;&gt;${art(f)}&lt;span class=&quot;m-play-dot&quot;&gt;${icon(&#x27;play&#x27;)}&lt;/span&gt;&lt;span class=&quot;m-duration&quot;&gt;${continued?&#x27;剩余 &#x27;+clock(f.duration-f.position):clock(f.duration)}&lt;/span&gt;${continued?`&lt;span class=&quot;m-progress&quot; style=&quot;width:${f.position/f.duration*100}%&quot;&gt;&lt;/span&gt;`:&#x27;&#x27;}&lt;/button&gt;&lt;div class=&quot;m-card-info&quot;&gt;&lt;div&gt;&lt;strong&gt;${f.title}&lt;/strong&gt;&lt;small&gt;${continued?&#x27;上次看到 &#x27;+clock(f.position):f.resolution+&#x27; · &#x27;+f.codec+&#x27; · &#x27;+f.kind}&lt;/small&gt;&lt;/div&gt;${ib(&#x27;detail:&#x27;+f.id,&#x27;查看&#x27;+f.title+&#x27;文件信息&#x27;,&#x27;ellipsis&#x27;)}&lt;/div&gt;&lt;/article&gt;`;}
function grid(items,continued=false){return `&lt;div class=&quot;${continued?&#x27;m-continue-grid&#x27;:&#x27;m-media-grid&#x27;}&quot;&gt;${items.map(f=&gt;card(f,continued)).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function empty(title,body,ic=&#x27;film&#x27;,actions=&#x27;&#x27;){return `&lt;div class=&quot;m-empty&quot;&gt;&lt;div class=&quot;m-empty-icon&quot;&gt;${icon(ic)}&lt;/div&gt;&lt;h2&gt;${title}&lt;/h2&gt;&lt;p&gt;${body}&lt;/p&gt;${actions}&lt;/div&gt;`;}
const navs=[[&#x27;home&#x27;,&#x27;首页&#x27;,&#x27;house&#x27;],[&#x27;library&#x27;,&#x27;视频库&#x27;,&#x27;clapperboard&#x27;],[&#x27;folders&#x27;,&#x27;文件夹&#x27;,&#x27;folder&#x27;],[&#x27;favorites&#x27;,&#x27;收藏&#x27;,&#x27;heart&#x27;],[&#x27;search&#x27;,&#x27;搜索&#x27;,&#x27;search&#x27;]];
function sidebar(){return `&lt;aside class=&quot;m-sidebar&quot;&gt;&lt;div class=&quot;m-nav-section&quot; style=&quot;padding-top:0&quot;&gt;你的影像&lt;/div&gt;${navs.map(([v,t,i])=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;nav:${v}&quot; class=&quot;m-nav cursor-interaction&quot; aria-current=&quot;${state.view===v?&#x27;page&#x27;:&#x27;false&#x27;}&quot;&gt;${icon(i)}${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;m-nav-section&quot;&gt;位置&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;m-nav m-source-nav cursor-interaction&quot; data-action=&quot;source:旅行影像&quot;&gt;${icon(&#x27;folder-open&#x27;)}旅行影像&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;m-nav m-source-nav cursor-interaction&quot; data-action=&quot;nav:offline&quot;&gt;${icon(&#x27;hard-drive&#x27;)}外接硬盘 &lt;span style=&quot;margin-left:auto;font-size:10px&quot;&gt;${state.offline?&#x27;离线&#x27;:&#x27;已连接&#x27;}&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;m-local-tag&quot;&gt;${icon(&#x27;shield-check&#x27;)}只在这台 Mac 上&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;m-nav cursor-interaction&quot; data-action=&quot;nav:settings&quot; aria-current=&quot;${state.view===&#x27;settings&#x27;?&#x27;page&#x27;:&#x27;false&#x27;}&quot;&gt;${icon(&#x27;settings-2&#x27;)}设置&lt;/button&gt;&lt;/aside&gt;`;}
function shell(content){return `&lt;div class=&quot;m-shell ${state.compact?&#x27;m-compact&#x27;:&#x27;&#x27;}&quot;&gt;${sidebar()}&lt;main class=&quot;m-main&quot;&gt;${content}&lt;/main&gt;&lt;/div&gt;`;}
function player(){const f=films[state.film];return `&lt;div class=&quot;m-play-layout&quot;&gt;&lt;section class=&quot;m-player&quot; aria-label=&quot;${f.title}播放界面&quot;&gt;&lt;div class=&quot;m-video-frame&quot;&gt;${art(f)}&lt;/div&gt;&lt;div class=&quot;m-player-top&quot;&gt;&lt;div class=&quot;m-actions&quot;&gt;${ib(&#x27;nav:home&#x27;,&#x27;返回视频库&#x27;,&#x27;chevron-left&#x27;,&#x27;m-glass&#x27;)}&lt;span class=&quot;m-file-title&quot;&gt;${f.title}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;m-actions&quot;&gt;${ib(&#x27;pop:rate&#x27;,state.rate+&#x27; 倍速&#x27;,&#x27;gauge&#x27;,&#x27;m-glass&#x27;)}${ib(&#x27;pop:tracks&#x27;,&#x27;字幕与音轨&#x27;,&#x27;captions&#x27;,&#x27;m-glass&#x27;)}${ib(&#x27;queue&#x27;,&#x27;播放队列&#x27;,&#x27;list-video&#x27;,&#x27;m-glass&#x27;)}${ib(&#x27;favorite&#x27;,&#x27;收藏视频&#x27;,f.favorite?&#x27;heart-handshake&#x27;:&#x27;heart&#x27;,&#x27;m-glass&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;m-center-controls&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;skip:-10&quot; class=&quot;m-glass cursor-interaction&quot; aria-label=&quot;后退 10 秒&quot;&gt;${icon(&#x27;rotate-ccw&#x27;)}&lt;span class=&quot;m-skip-label&quot;&gt;10&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;play&quot; class=&quot;m-glass m-play cursor-interaction&quot; aria-label=&quot;${state.playing?&#x27;暂停&#x27;:&#x27;播放&#x27;}&quot;&gt;${icon(state.playing?&#x27;pause&#x27;:&#x27;play&#x27;)}&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;skip:10&quot; class=&quot;m-glass cursor-interaction&quot; aria-label=&quot;前进 10 秒&quot;&gt;${icon(&#x27;rotate-cw&#x27;)}&lt;span class=&quot;m-skip-label&quot;&gt;10&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;${state.sub!==&#x27;关闭&#x27;?`&lt;div class=&quot;m-subtitle&quot;&gt;${state.sub===&#x27;English&#x27;?&#x27;Some journeys are meant to be taken slowly.&#x27;:&#x27;有些旅程，值得慢一点。&#x27;}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;m-bottom-controls&quot;&gt;&lt;div class=&quot;m-timeline&quot;&gt;&lt;span id=&quot;m-time&quot;&gt;${clock(state.time)}&lt;/span&gt;&lt;input id=&quot;m-seek&quot; type=&quot;range&quot; aria-label=&quot;播放进度&quot; min=&quot;0&quot; max=&quot;${f.duration}&quot; value=&quot;${state.time}&quot; style=&quot;--m-progress:${state.time/f.duration*100}%&quot;&gt;&lt;span id=&quot;m-remaining&quot;&gt;−${clock(f.duration-state.time)}&lt;/span&gt;&lt;div class=&quot;m-volume&quot;&gt;${ib(&#x27;mute&#x27;,state.muted?&#x27;取消静音&#x27;:&#x27;静音&#x27;,state.muted?&#x27;volume-x&#x27;:&#x27;volume-2&#x27;)}&lt;input id=&quot;m-volume&quot; type=&quot;range&quot; aria-label=&quot;音量&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;${state.muted?0:state.volume}&quot; style=&quot;--m-progress:${state.muted?0:state.volume}%&quot;&gt;&lt;/div&gt;${ib(&#x27;immersive&#x27;,state.immersive?&#x27;退出沉浸预览&#x27;:&#x27;沉浸预览&#x27;,&#x27;maximize&#x27;)}&lt;/div&gt;&lt;/div&gt;${popper()}&lt;/section&gt;${state.queue?queue():&#x27;&#x27;}&lt;/div&gt;${!state.immersive?`&lt;div class=&quot;m-player-meta&quot;&gt;&lt;div&gt;&lt;h2&gt;${f.title}&lt;/h2&gt;&lt;small&gt;${f.folder} &lt;span style=&quot;padding:0 5px&quot;&gt;/&lt;/span&gt; ${f.file}&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;m-meta-right&quot;&gt;&lt;span&gt;${f.resolution}&lt;/span&gt;&lt;span&gt;${f.codec}&lt;/span&gt;&lt;span&gt;原声&lt;/span&gt;${ib(&#x27;detail:&#x27;+f.id,&#x27;文件信息&#x27;,&#x27;info&#x27;)}&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}`;}
function popper(){if(!state.pop)return &#x27;&#x27;;if(state.pop===&#x27;rate&#x27;)return `&lt;div class=&quot;m-popper&quot;&gt;&lt;div class=&quot;m-toprow&quot;&gt;&lt;h3&gt;播放速度&lt;/h3&gt;${ib(&#x27;pop:rate&#x27;,&#x27;关闭速度菜单&#x27;,&#x27;x&#x27;)}&lt;/div&gt;&lt;div class=&quot;m-rate-grid&quot;&gt;${[&#x27;0.5&#x27;,&#x27;0.75&#x27;,&#x27;1.0&#x27;,&#x27;1.25&#x27;,&#x27;1.5&#x27;,&#x27;2.0&#x27;].map(r=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;rate:${r}&quot; aria-pressed=&quot;${state.rate===r}&quot;&gt;${r}×&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;return `&lt;div class=&quot;m-popper&quot;&gt;&lt;div class=&quot;m-toprow&quot;&gt;&lt;h3&gt;字幕&lt;/h3&gt;${ib(&#x27;pop:tracks&#x27;,&#x27;关闭字幕菜单&#x27;,&#x27;x&#x27;)}&lt;/div&gt;${[&#x27;关闭&#x27;,&#x27;简体中文&#x27;,&#x27;English&#x27;].map(s=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;sub:${s}&quot; aria-pressed=&quot;${state.sub===s}&quot;&gt;${s}${state.sub===s?icon(&#x27;check&#x27;):&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;)}${button(&#x27;loadSub&#x27;,&#x27;载入字幕文件…&#x27;,&#x27;plus&#x27;)}&lt;hr&gt;&lt;h3&gt;音轨&lt;/h3&gt;${[&#x27;原声 · 立体声&#x27;,&#x27;英语 · 立体声&#x27;].map(a=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;audio:${a}&quot; aria-pressed=&quot;${state.audio===a}&quot;&gt;${a}${state.audio===a?icon(&#x27;check&#x27;):&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function queue(){return `&lt;aside class=&quot;m-queue&quot;&gt;&lt;div class=&quot;m-toprow&quot;&gt;&lt;h3&gt;接下来播放&lt;/h3&gt;${ib(&#x27;queue&#x27;,&#x27;关闭播放队列&#x27;,&#x27;x&#x27;)}&lt;/div&gt;&lt;p class=&quot;m-page-sub&quot;&gt;旅行影像 · 3 个视频&lt;/p&gt;${films.filter(f=&gt;f.folder===&#x27;旅行影像&#x27;).map(f=&gt;`&lt;button type=&quot;button&quot; class=&quot;m-queue-item cursor-interaction&quot; data-action=&quot;film:${f.id}&quot; aria-pressed=&quot;${f.id===state.film}&quot;&gt;&lt;div class=&quot;m-mini-art&quot; style=&quot;overflow:hidden&quot;&gt;${art(f)}&lt;/div&gt;&lt;div&gt;&lt;strong&gt;${f.title}&lt;/strong&gt;&lt;small&gt;${f.id===state.film?&#x27;正在观看&#x27;:clock(f.duration)}&lt;/small&gt;&lt;/div&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;m-setting-row&quot; style=&quot;padding:15px 4px&quot;&gt;&lt;label for=&quot;m-next&quot;&gt;自动播放下一个&lt;/label&gt;&lt;input id=&quot;m-next&quot; type=&quot;checkbox&quot; data-setting=&quot;autoNext&quot; ${state.autoNext?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;/div&gt;&lt;/aside&gt;`;}
function home(){return shell(`${head(&#x27;好时光，接着看。&#x27;,&#x27;你的影像，都在这里。&#x27;,button(&#x27;import&#x27;,&#x27;添加文件夹&#x27;,&#x27;plus&#x27;,&#x27;m-primary&#x27;))}&lt;div class=&quot;m-section-head&quot;&gt;&lt;h2&gt;继续观看&lt;/h2&gt;${button(&#x27;nav:library&#x27;,&#x27;查看全部&#x27;,&#x27;arrow-up-right&#x27;)}&lt;/div&gt;${grid(films.slice(0,2),true)}&lt;div class=&quot;m-section-head&quot;&gt;&lt;h2&gt;最近添加&lt;/h2&gt;&lt;small&gt;来自这台 Mac&lt;/small&gt;&lt;/div&gt;${grid(films.slice(2,5))}`);}
function list(items){return `&lt;div class=&quot;m-list&quot;&gt;${items.map(f=&gt;`&lt;div class=&quot;m-list-row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;m-list-art cursor-interaction&quot; style=&quot;padding:0&quot; data-action=&quot;film:${f.id}&quot; aria-label=&quot;播放${f.title}&quot;&gt;${art(f)}&lt;/button&gt;&lt;div class=&quot;m-list-text&quot;&gt;&lt;strong&gt;${f.title}&lt;/strong&gt;&lt;small&gt;${f.file} · ${f.resolution} · ${f.codec}&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;m-list-time&quot;&gt;${clock(f.duration)}&lt;/span&gt;${ib(&#x27;detail:&#x27;+f.id,&#x27;查看&#x27;+f.title+&#x27;详情&#x27;,&#x27;ellipsis&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function library(){let items=films.filter(f=&gt;(state.filter===&#x27;全部&#x27;||f.kind===state.filter)&amp;&amp;(!state.folder||f.folder===state.folder));return shell(`${head(state.folder||&#x27;视频库&#x27;,`${state.folder?&#x27;文件夹视图 · &#x27;:&#x27;&#x27;}${items.length} 个视频 · 保留原始文件`,button(&#x27;import&#x27;,&#x27;添加&#x27;,&#x27;plus&#x27;,&#x27;m-secondary&#x27;))}${state.folder?button(&#x27;clearFolder&#x27;,&#x27;全部视频&#x27;,&#x27;chevron-left&#x27;):&#x27;&#x27;}&lt;div class=&quot;m-library-tools&quot;&gt;&lt;div class=&quot;m-filter&quot;&gt;${[&#x27;全部&#x27;,&#x27;旅行&#x27;,&#x27;日常&#x27;,&#x27;自然&#x27;].map(t=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;filter:${t}&quot; aria-pressed=&quot;${state.filter===t}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;m-actions&quot;&gt;&lt;label&gt;&lt;select id=&quot;m-sort&quot; aria-label=&quot;视频排序&quot;&gt;&lt;option value=&quot;recent&quot;&gt;最近添加&lt;/option&gt;&lt;option value=&quot;title&quot;&gt;名称&lt;/option&gt;&lt;option value=&quot;duration&quot;&gt;时长&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;div class=&quot;m-view-toggle&quot;&gt;${[&#x27;grid&#x27;,&#x27;list&#x27;].map((v,i)=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;layout:${v}&quot; aria-label=&quot;${i?&#x27;列表&#x27;:&#x27;网格&#x27;}视图&quot; aria-pressed=&quot;${state.layout===v}&quot;&gt;${icon(i?&#x27;list&#x27;:&#x27;layout-grid&#x27;)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;m-library-results&quot;&gt;${items.length?(state.layout===&#x27;grid&#x27;?grid(items):list(items)):empty(&#x27;这里暂时没有视频&#x27;,&#x27;换一个分类，或者添加一个本地文件夹。&#x27;,&#x27;film&#x27;)}&lt;/div&gt;`);}

function favorites(){const items=films.filter(f=&gt;f.favorite);return shell(`${head(&#x27;喜欢的，留在这里。&#x27;,`${items.length} 个收藏 · 随时回来看看`)}&lt;div style=&quot;margin-top:27px&quot;&gt;${items.length?grid(items):empty(&#x27;还没有收藏&#x27;,&#x27;播放时点一下爱心，把喜欢的片段所在视频留在这里。&#x27;,&#x27;heart&#x27;,button(&#x27;nav:library&#x27;,&#x27;浏览视频库&#x27;,&#x27;arrow-right&#x27;,&#x27;m-primary&#x27;))}&lt;/div&gt;`);}
function search(){return shell(`${head(&#x27;找一段好时光&#x27;,&#x27;搜索文件名、视频名称或文件夹。&#x27;)}&lt;label class=&quot;m-search-wrap&quot;&gt;${icon(&#x27;search&#x27;)}&lt;input id=&quot;m-search&quot; type=&quot;search&quot; aria-label=&quot;搜索视频&quot; placeholder=&quot;搜索你的视频…&quot; value=&quot;${esc(state.query)}&quot;&gt;${ib(&#x27;clearSearch&#x27;,&#x27;清空搜索&#x27;,&#x27;x&#x27;)}&lt;/label&gt;&lt;div id=&quot;m-search-results&quot; aria-live=&quot;polite&quot;&gt;${searchResults()}&lt;/div&gt;`);}

function settings(){let content=&#x27;&#x27;;switch(state.settingsTab){case&#x27;外观&#x27;:content=setting(&#x27;界面外观&#x27;,&#x27;白色内容区，浅灰蓝侧栏。&#x27;,selectSetting(&#x27;appearance&#x27;,[&#x27;浅色&#x27;,&#x27;跟随系统&#x27;]))+setting(&#x27;紧凑的视频库&#x27;,&#x27;让同一屏幕显示更多视频。&#x27;,toggle(&#x27;compact&#x27;,&#x27;紧凑的视频库&#x27;))+setting(&#x27;默认打开&#x27;,&#x27;启动后显示的页面。&#x27;,`&lt;select data-setting=&quot;startPage&quot; aria-label=&quot;默认打开的页面&quot;&gt;&lt;option&gt;首页&lt;/option&gt;&lt;option&gt;视频库&lt;/option&gt;&lt;option&gt;上次播放&lt;/option&gt;&lt;/select&gt;`);break;case&#x27;播放&#x27;:content=setting(&#x27;从上次的位置继续&#x27;,&#x27;为每个本地视频记住播放进度。&#x27;,toggle(&#x27;resume&#x27;,&#x27;记住播放进度&#x27;))+setting(&#x27;自动播放下一个&#x27;,&#x27;仅在当前播放队列中继续。&#x27;,toggle(&#x27;autoNext&#x27;,&#x27;自动播放下一个&#x27;))+setting(&#x27;硬件解码&#x27;,&#x27;可用时优先降低功耗和发热。&#x27;,toggle(&#x27;hardware&#x27;,&#x27;硬件解码&#x27;))+setting(&#x27;默认播放速度&#x27;,&#x27;新打开的视频使用这个速度。&#x27;,`&lt;select data-setting=&quot;rate&quot; aria-label=&quot;默认播放速度&quot;&gt;${[&#x27;0.5&#x27;,&#x27;0.75&#x27;,&#x27;1.0&#x27;,&#x27;1.25&#x27;,&#x27;1.5&#x27;,&#x27;2.0&#x27;].map(r=&gt;`&lt;option value=&quot;${r}&quot; ${state.rate===r?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${r}×&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;`);break;case&#x27;字幕&#x27;:content=setting(&#x27;自动匹配字幕&#x27;,&#x27;查找视频同目录下同名字幕文件。&#x27;,toggle(&#x27;autoSub&#x27;,&#x27;自动匹配字幕&#x27;))+setting(&#x27;字幕大小&#x27;,&#x27;保持清晰，避免遮挡画面。&#x27;,selectSetting(&#x27;subtitleSize&#x27;,[&#x27;较小&#x27;,&#x27;适中&#x27;,&#x27;较大&#x27;]))+setting(&#x27;字幕同步&#x27;,&#x27;正数表示字幕延后，单位为秒。&#x27;,`&lt;select data-setting=&quot;subtitleDelay&quot; aria-label=&quot;字幕延迟&quot;&gt;&lt;option value=&quot;0.0&quot;&gt;0.0 秒&lt;/option&gt;&lt;option value=&quot;0.5&quot;&gt;+0.5 秒&lt;/option&gt;&lt;option value=&quot;-0.5&quot;&gt;−0.5 秒&lt;/option&gt;&lt;/select&gt;`)+setting(&#x27;默认字幕语言&#x27;,&#x27;优先使用匹配语言的字幕。&#x27;,`&lt;select data-setting=&quot;sub&quot; aria-label=&quot;默认字幕语言&quot;&gt;&lt;option&gt;简体中文&lt;/option&gt;&lt;option&gt;English&lt;/option&gt;&lt;option&gt;关闭&lt;/option&gt;&lt;/select&gt;`);break;case&#x27;存储&#x27;:content=setting(&#x27;媒体文件夹&#x27;,&#x27;管理这台 Mac 和外接硬盘上的位置。&#x27;,button(&#x27;nav:folders&#x27;,&#x27;管理文件夹&#x27;,&#x27;folder&#x27;,&#x27;m-secondary&#x27;))+setting(&#x27;缩略图缓存&#x27;,&#x27;可重新生成，不影响原视频。&#x27;,button(&#x27;clearCache&#x27;,&#x27;清理 128 MB&#x27;,null,&#x27;m-secondary&#x27;))+setting(&#x27;观看记录&#x27;,&#x27;清除进度和最近观看记录。&#x27;,button(&#x27;clearHistory&#x27;,&#x27;清除记录&#x27;,null,&#x27;m-secondary&#x27;))+setting(&#x27;原始视频&#x27;,&#x27;添加文件夹时仅建立索引，不复制或压缩视频。&#x27;,`&lt;span class=&quot;m-badge&quot;&gt;保持原文件&lt;/span&gt;`);break;case&#x27;关于&#x27;:content=setting(&#x27;mori&#x27;,&#x27;让本地播放，舒服一点。&#x27;,`&lt;span class=&quot;m-badge&quot;&gt;概念设计 v0.2&lt;/span&gt;`)+setting(&#x27;连接方式&#x27;,&#x27;播放、收藏和观看记录保存在本机。&#x27;,`&lt;span class=&quot;m-badge&quot;&gt;无需账号&lt;/span&gt;`)+setting(&#x27;检查更新&#x27;,&#x27;正式版从项目网站获取已签名的安装包。&#x27;,button(&#x27;updates&#x27;,&#x27;检查更新&#x27;,&#x27;refresh-cw&#x27;,&#x27;m-secondary&#x27;))+setting(&#x27;键盘操作&#x27;,&#x27;空格：播放 / 暂停；← →：前后 10 秒；Esc：关闭菜单。&#x27;,icon(&#x27;keyboard&#x27;));break;}
return shell(`${head(&#x27;设置&#x27;,&#x27;把播放器调成你喜欢的样子。&#x27;)}&lt;div class=&quot;m-settings-tabs&quot;&gt;${[&#x27;外观&#x27;,&#x27;播放&#x27;,&#x27;字幕&#x27;,&#x27;存储&#x27;,&#x27;关于&#x27;].map(t=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;settingsTab:${t}&quot; aria-pressed=&quot;${state.settingsTab===t}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${content}&lt;div class=&quot;m-settings-foot&quot;&gt;${icon(&#x27;shield-check&#x27;)}设置保存在本机，无需登录。&lt;/div&gt;`);}

function render(){const views={player,home,library,folders,favorites,search,settings,welcome,offline,error};app.innerHTML=(views[state.view]||player)();root.querySelector(&#x27;#m-window-title&#x27;).textContent=state.view===&#x27;player&#x27;?films[state.film].title:({home:&#x27;首页&#x27;,library:&#x27;视频库&#x27;,folders:&#x27;文件夹&#x27;,favorites:&#x27;收藏&#x27;,search:&#x27;搜索&#x27;,settings:&#x27;设置&#x27;,welcome:&#x27;欢迎使用 mori&#x27;,offline:&#x27;外接硬盘&#x27;,error:&#x27;播放失败&#x27;}[state.view]||&#x27;mori&#x27;);scene.value=state.view;renderOverlay();icons();}
